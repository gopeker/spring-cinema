name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: springcinema
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d springcinema"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build and test backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/springcinema
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_AI_OPENAI_BASE_URL: http://localhost:11434
          SPRING_AI_OPENAI_API_KEY: dummy-key
        run: ./mvnw -B verify

      - name: Build frontend (production)
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build — spring-app
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: spring-cinema-spring-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build — frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          dockerfile: frontend/Dockerfile
          push: false
          tags: spring-cinema-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
