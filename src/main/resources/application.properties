spring.application.name=spring-cinema

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springcinema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-in-production-use-a-long-random-string}
app.jwt.expiration=3600000

# Jackson 3 + Hibernate bytecode enhancer fix
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Docker compose file for spring-boot-docker-compose
spring.docker.compose.file=${user.dir}/spring-boot-compose.yaml

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.cinema.springcinema=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Spring AI - OpenAI Client for LM Studio
spring.ai.openai.base-url=http://127.0.0.1:1234
spring.ai.openai.chat.options.model=gemma-4-e4b-it-mlx
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.api-key=dummy-key
spring.ai.openai.chat.options.maxTokens=500
