<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card card-cinema">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Login</h2>
          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-control-dark" [(ngModel)]="email" name="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control form-control-dark" [(ngModel)]="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-cinema w-100">Login</button>
          </form>
          <p class="text-center mt-3">
            Don't have an account? <a routerLink="/register">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
