<h2 mat-dialog-title>{{ data ? 'Edit Movie' : 'Add Movie' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title">
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <mat-error>Title is required</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Duration (minutes)</mat-label>
      <input matInput type="number" formControlName="duration">
      @if (form.get('duration')?.invalid && form.get('duration')?.touched) {
        <mat-error>Duration is required</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Poster URL</mat-label>
      <input matInput formControlName="posterUrl">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || saving()">Save</button>
</mat-dialog-actions>
