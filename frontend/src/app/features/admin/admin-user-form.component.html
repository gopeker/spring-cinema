<h2 mat-dialog-title>{{ data ? 'Edit User' : 'Add User' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <h4>Basic Info</h4>
    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
    </div>
    <div class="row-2">
      <mat-form-field appearance="outline">
        <mat-label>{{ data ? 'New Password (leave blank to keep)' : 'Password' }}</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option value="USER">USER</mat-option>
          <mat-option value="ADMIN">ADMIN</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-divider></mat-divider>
    <h4>Address</h4>
    <div class="row-2" formGroupName="address">
      <mat-form-field appearance="outline">
        <mat-label>Street</mat-label>
        <input matInput formControlName="street">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Postal Code</mat-label>
        <input matInput formControlName="postalCode">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Country</mat-label>
        <input matInput formControlName="country">
      </mat-form-field>
    </div>

    <mat-divider></mat-divider>
    <h4>Payment Details</h4>
    <div class="row-3" formGroupName="paymentDetails">
      <mat-form-field appearance="outline">
        <mat-label>Card Holder Name</mat-label>
        <input matInput formControlName="cardHolderName">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Card Last Four</mat-label>
        <input matInput formControlName="cardLastFour" maxlength="4">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Expiry (MM/YY)</mat-label>
        <input matInput formControlName="cardExpiry" placeholder="12/27">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || saving()">Save</button>
</mat-dialog-actions>
